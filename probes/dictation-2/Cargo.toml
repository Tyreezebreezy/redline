[package]
name = "redline-dictation-2-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["shared"] }
whisper-rs = "0.16.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
