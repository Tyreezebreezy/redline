[package]
name = "redline"
version = "0.6.0"
description = "Local-first writing assistant foundation"
authors = ["Tyree"]
edition = "2024"

[lib]
name = "redline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
llama-cpp-2 = { version = "=0.1.153", default-features = false, features = ["dynamic-link"] }
llama-cpp-sys-2 = { version = "=0.1.153", default-features = false, features = ["dynamic-link"] }
regex = "=1.12.2"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
rubato = "=5.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "2", features = [] }
unicode-normalization = "=0.1.24"
whisper-rs = { version = "=0.16.0", default-features = false }

[dev-dependencies]
hound = "=3.5.1"
